  <path d="M 25.894 86 A 44 44 0 0 1 89.863 28.403" fill="none" stroke="#33d17a" stroke-width="11" stroke-linecap="round"/>
  <!-- agent -->
  <rect x="61.5" y="36" width="5" height="14" rx="2.5" fill="#c0bfbc"/>
  <circle cx="64" cy="37" r="5.5" fill="#62a0ea"/>
  <rect x="35" y="50" width="58" height="44" rx="14" fill="#9a9996"/>
  <rect x="35" y="47" width="58" height="43" rx="14" fill="url(#shell)"/>
  <rect x="42" y="54" width="44" height="28" rx="9" fill="#241f31"/>
  <rect x="51" y="60" width="9" height="15" rx="4.5" fill="#99c1f1"/>
  <rect x="68" y="60" width="9" height="15" rx="4.5" fill="#99c1f1"/>
